<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Web Wisata Batu Angus</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <!-- Header & Navigasi -->
    <header class="site-header">
        <div class="brand">Web wisata batu angus</div>
        <nav class="site-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="registration.html" class="active">Registration</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Form Pesan Kunjungan / Data Pengunjung -->
    <section id="pesan">
        <h2>Pesan Kunjungan</h2>
        <form action="#" method="post">
          <fieldset>
            <legend>Data Pengunjung</legend>

            <label for="nama">Nama</label>
            <input type="text" id="nama" name="nama" required />

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />

            <label for="tgl">Tanggal Kunjungan</label>
            <input type="date" id="tgl" name="tgl" />

            <label for="jml">Jumlah Orang</label>
            <input type="number" id="jml" name="jml" min="1" max="20" />

            <label for="paket">Paket</label>
            <select id="paket" name="paket">
              <option>Snorkeling</option>
              <option>Diving</option>
              <option>Island Tour</option>
            </select>

            <label for="catatan">Catatan / Pesan Pengunjung</label>
            <textarea id="catatan" name="catatan" rows="3"></textarea>

            <button type="submit">Kirim Pesanan</button>
          </fieldset>
        </form>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
      <p><strong>Dikelola oleh Khrizma easter Wales</strong></p>
      <p>Email: <a href="mailto:info@batu.angus">info@batu.angus</a></p>
      <p>Telp: <a href="tel:+6282252384152">0822-5238-4152</a></p>
    </footer>
</body>
</html>
